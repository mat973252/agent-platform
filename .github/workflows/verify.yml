name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure ephemeral approval database credential
        run: |
          python3 - <<'PY'
          import os, secrets
          credential = secrets.token_urlsafe(32)
          print("::add-mask::" + credential, flush=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("PLATFORM_DATABASE_PASSWORD=" + credential + "\n")
          PY
      - name: Build locked AgentPermit dependency
        run: python3 scripts/bootstrap-agentpermit.py
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Check status exporter mapping tests
        run: python3 scripts/export-status-test.py
      - name: Validate local deployment
        run: docker compose config --quiet
      - name: Start Temporal and approval PostgreSQL databases
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify Worker, approval database and message recovery
        run: python3 scripts/smoke.py --restart-approval-db
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-evidence
          path: |
            **/target/surefire-reports/
            var/smoke.log
            compose.log
      - name: Stop test containers
        if: always()
        run: docker compose down
