name: verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure ephemeral approval database credential
        run: |
          python3 - <<'PY'
          import os, secrets
          credential = secrets.token_urlsafe(32)
          print("::add-mask::" + credential, flush=True)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              output.write("PLATFORM_DATABASE_PASSWORD=" + credential + "\n")
          PY
      - name: Build locked AgentPermit dependency
        run: python3 scripts/bootstrap-agentpermit.py
      - name: Build and test
        run: ./mvnw -B -ntp verify
      - name: Check status exporter mapping tests
        run: python3 scripts/export-status-test.py
      - name: Validate local deployment
        run: docker compose config --quiet
      - name: Start Temporal and approval PostgreSQL databases
        run: docker compose up -d --wait --wait-timeout 180
      - name: Verify Worker, approval database and message recovery
        run: python3 scripts/smoke.py --restart-approval-db
      - name: Check out the fixed pre-upgrade application
        uses: actions/checkout@v5
        with:
          ref: 664e2886184773d49f952a682d166a658651f071
          path: var/compat-old-source
          persist-credentials: false
      - name: Build the old application with its own locked dependency
        working-directory: var/compat-old-source
        run: |
          python3 scripts/bootstrap-agentpermit.py
          ./mvnw -B -ntp -DskipTests package
      - name: Verify recovery from AgentPermit 0.2 to 0.5
        run: python3 scripts/upgrade-smoke.py --old-jar var/compat-old-source/platform-api/target/platform-api-0.1.0-SNAPSHOT.jar
      - name: Upload cross-version recovery evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cross-version-recovery
          path: |
            var/p4-upgrade-result.json
            var/p4-upgrade-application.log
          if-no-files-found: warn
          retention-days: 3
      - name: Upload the sanitized status export from this test run
        uses: actions/upload-artifact@v6
        with:
          name: mat-console-status
          path: var/mat-console-status.json
          if-no-files-found: error
          retention-days: 3
      - name: Collect container logs
        if: failure()
        run: docker compose logs --no-color > compose.log
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: failure-evidence
          path: |
            **/target/surefire-reports/
            var/smoke.log
            compose.log
      - name: Stop test containers
        if: always()
        run: docker compose down
