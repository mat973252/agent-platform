name: agent-platform
services:
  approval-db:
    image: postgres:16
    environment:
      POSTGRES_USER: agent_platform
      POSTGRES_PASSWORD: ${PLATFORM_DATABASE_PASSWORD:?Set PLATFORM_DATABASE_PASSWORD}
      POSTGRES_DB: agent_platform
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - approval-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U agent_platform -d agent_platform"]
      interval: 3s
      timeout: 3s
      retries: 30

  postgresql:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal-local-demo
      POSTGRES_DB: temporal
    volumes:
      - temporal-data:/var/lib/postgresql/data
      - ./deploy/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U temporal -d temporal"]
      interval: 3s
      timeout: 3s
      retries: 30

  schema:
    image: temporalio/admin-tools:1.31.0
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      SQL_PASSWORD: temporal-local-demo
    volumes:
      - ./deploy/setup-schema.sh:/scripts/setup-schema.sh:ro
    entrypoint: [/bin/sh, /scripts/setup-schema.sh]

  temporal:
    image: temporalio/server:1.31.0
    depends_on:
      schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal-local-demo
      POSTGRES_SEEDS: postgresql
      BIND_ON_IP: 0.0.0.0
    volumes:
      - ./deploy/dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/docker.yaml:ro
    ports:
      - "127.0.0.1:7233:7233"
    healthcheck:
      test: [CMD, nc, -z, localhost, "7233"]
      interval: 3s
      timeout: 3s
      retries: 60

  namespace:
    image: temporalio/admin-tools:1.31.0
    depends_on:
      temporal:
        condition: service_healthy
    restart: on-failure:5
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        temporal operator namespace describe --namespace default --address temporal:7233
        || temporal operator namespace create --namespace default --address temporal:7233

  temporal-ui:
    image: temporalio/ui:2.49.1
    depends_on:
      namespace:
        condition: service_completed_successfully
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"

volumes:
  temporal-data:
  approval-data:
